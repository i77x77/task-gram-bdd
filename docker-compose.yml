services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/taskgram.db
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SHEET_URL: ${SHEET_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-31.57.28.235}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  bot:
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env}
      BACKEND_URL: http://backend:8000
      INGEST_API_KEY: ${INGEST_API_KEY}
      APP_PASSWORD: ${APP_PASSWORD:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://vyceai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-DeepSeek-V4.1-Flash}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "8443:443"  # 443 на сервере занят xray
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # TURN-ретранслятор для звонков за строгим NAT. host-сеть: иначе пришлось бы пробрасывать весь диапазон UDP-портов.
  # Нужно открыть: 3478 TCP+UDP и 49160-49200 UDP.
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command: >
      -n --log-file=stdout --realm=pulse --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      --listening-port=3478 --min-port=49160 --max-port=49200
      --external-ip=${TURN_HOST:-31.57.28.235}
      --no-cli --no-multicast-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
