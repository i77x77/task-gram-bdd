<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Камеры на трассе</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #111322; color: #f5f2ff; font: 16px system-ui }
main { width: min(100%, 540px); margin: auto; padding: 12px }
h1 { margin: 0; color: #f8ca81; font-size: clamp(22px, 6vw, 32px) }
p { margin: 6px 0; color: #ddd6ed }
section { position: relative; overflow: hidden; border: 1px solid #514970; border-radius: 14px }
canvas { display: block; width: 100%; height: min(58dvh, 580px) }
aside { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 16px; background: #111322e6 }
aside[hidden] { display: none }
h2 { margin: 0 }
select, input { font: inherit; padding: 8px; border: 1px solid #65577b; border-radius: 8px; background: #28203a; color: #f5f2ff }
.settings, form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 }
form[hidden] { display: none }
table { width: 100%; border-collapse: collapse; text-align: left }
th, td { padding: 5px; border-bottom: 1px solid #514970; overflow-wrap: anywhere }
h2.records { margin-top: 16px; font-size: 20px }
canvas { cursor: crosshair; touch-action: manipulation }
button { font: inherit; font-weight: 700; padding: 11px; border: 0; border-radius: 9px; background: #f8ca81; color: #21182b; cursor: pointer; touch-action: manipulation }
button:focus-visible { outline: 3px solid #fff; outline-offset: -4px }
nav { display: flex; gap: 8px; margin-top: 8px }
nav button { flex: 1 }
nav button:disabled { opacity: .5; cursor: default }
</style>
<main>
  <h1>Камеры на трассе</h1>
  <div class="settings">
    <label for="difficulty">Сложность</label>
    <select id="difficulty">
      <option value="easy">Лёгкая</option>
      <option value="normal" selected>Средняя</option>
      <option value="hard">Сложная</option>
    </select>
  </div>
  <p>Сбито <b id="hits">0</b> · Штрафы <b id="fines">0</b>/5</p>
  <section>
    <canvas width="420" height="500" aria-label="Трасса с аркадными камерами по обочинам"></canvas>
    <aside id="overlay">
      <h2 id="message">Готов к заезду?</h2>
      <p id="hint">Кликни или тапни в любую точку поля, чтобы выстрелить туда. Камера выдерживает три попадания. Стрелки стреляют по бокам. Пять штрафов заканчивают заезд.</p>
      <button id="start">Играть</button>
    </aside>
  </section>
  <nav aria-label="Выстрел">
    <button data-side="-1" disabled>Влево · ←</button>
    <button data-side="1" disabled>Вправо · →</button>
  </nav>
  <form id="publish" hidden>
    <input id="player" aria-label="Публичный ник" placeholder="Публичный ник" maxlength="32" required>
    <button>Опубликовать результат</button>
  </form>
  <h2 class="records">Публичные рекорды</h2>
  <p id="record-status" role="status"></p>
  <table>
    <thead><tr><th>Место</th><th>Игрок</th><th>Камер сбито</th></tr></thead>
    <tbody id="records"></tbody>
  </table>
</main>
<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.querySelector('#overlay');
const start = document.querySelector('#start');
const hitsLabel = document.querySelector('#hits');
const finesLabel = document.querySelector('#fines');
const shootButtons = document.querySelectorAll('[data-side]');
const difficulty = document.querySelector('#difficulty');
const publish = document.querySelector('#publish');
const player = document.querySelector('#player');
const recordStatus = document.querySelector('#record-status');
const records = document.querySelector('#records');
const rankingUrl = '/api/v1/camera-records';
const modes = {
  easy: { speed: 120, maxSpeed: 220, interval: 1.65, minInterval: 0.8 },
  normal: { speed: 155, maxSpeed: 300, interval: 1.4, minInterval: 0.65 },
  hard: { speed: 205, maxSpeed: 365, interval: 1.1, minInterval: 0.5 },
};
let mode = modes.normal;
let rankingRequest = 0;
const zoneTop = 330;
const zoneBottom = 418;
const carX = 210;
const carY = 374;
let cameras = [];
let running = false;
let hits = 0;
let fines = 0;
let distance = 0;
let untilCamera = 0;
let previous = 0;
let shot = null;

function rect(x, y, width, height, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, width, height);
}

function inZone(camera) {
  return camera.y >= zoneTop && camera.y <= zoneBottom;
}

function cameraX(camera) {
  return camera.side === -1 ? 42 : 378;
}

function draw() {
  rect(0, 0, 420, 500, '#201a37');
  rect(74, 0, 272, 500, '#303247');
  for (let y = -52 + distance % 52; y < 500; y += 52) {
    rect(208, y, 4, 25, '#696982');
    rect(69, y, 5, 26, '#a378b3');
    rect(346, y, 5, 26, '#a378b3');
  }
  rect(0, zoneTop, 74, zoneBottom - zoneTop, '#543955');
  rect(346, zoneTop, 74, zoneBottom - zoneTop, '#543955');
  for (const camera of cameras) {
    const x = cameraX(camera);
    rect(x - 3, camera.y, 6, 20, '#bba7c9');
    rect(x - 14, camera.y - 10, 28, 20, inZone(camera) ? '#f8ca81' : '#916fac');
    rect(x - 5, camera.y - 5, 10, 10, '#272039');
    for (let life = 0; life < 3; life++) {
      rect(x - 14 + life * 10, camera.y - 17, 8, 4, life < camera.hp ? '#f8ca81' : '#514970');
    }
  }
  rect(carX - 19, carY - 29, 38, 58, '#f8ca81');
  rect(carX - 14, carY - 17, 28, 14, '#433655');
  rect(carX - 14, carY + 12, 28, 10, '#56436b');
  if (shot) {
    ctx.beginPath();
    ctx.moveTo(carX, carY);
    ctx.lineTo(shot.x, shot.y);
    ctx.strokeStyle = '#85f7ff';
    ctx.lineWidth = 4;
    ctx.stroke();
  }
}

function fire(x, y, target) {
  if (!running) return;
  shot = { x, y, remaining: 0.12 };
  if (target && --target.hp === 0) {
    cameras = cameras.filter(camera => camera !== target);
    hitsLabel.textContent = ++hits;
  }
  draw();
}

function fireSide(side) {
  const target = cameras.find(camera => camera.side === side && inZone(camera));
  fire(cameraX({ side }), target?.y ?? carY, target);
}

function frame(time) {
  const dt = Math.min((time - previous) / 1000, 0.04);
  previous = time;
  const speed = Math.min(mode.maxSpeed, mode.speed + distance / 60);
  distance += speed * dt;
  if (shot) {
    shot.remaining -= dt;
    if (shot.remaining <= 0) shot = null;
  }

  untilCamera -= dt;
  if (untilCamera <= 0) {
    cameras.push({ side: Math.random() < 0.5 ? -1 : 1, y: -20, hp: 3 });
    untilCamera = Math.max(mode.minInterval, mode.interval - distance / 7000) + Math.random() * 0.35;
  }
  for (const camera of cameras) camera.y += speed * dt;
  const missed = cameras.filter(camera => camera.y > zoneBottom).length;
  cameras = cameras.filter(camera => camera.y <= zoneBottom);
  fines = Math.min(5, fines + missed);
  finesLabel.textContent = fines;
  draw();

  if (fines < 5) {
    requestAnimationFrame(frame);
    return;
  }
  running = false;
  difficulty.disabled = false;
  publish.hidden = hits === 0;
  for (const button of shootButtons) button.disabled = true;
  document.querySelector('#message').textContent = 'Заезд окончен';
  document.querySelector('#hint').textContent = 'Камер сбито: ' + hits + '. Набралось 5 штрафов.';
  start.textContent = 'Ещё раз';
  overlay.hidden = false;
  start.focus();
}

start.addEventListener('click', () => {
  if (running) return;
  running = true;
  difficulty.disabled = true;
  publish.hidden = true;
  mode = modes[difficulty.value];
  hits = fines = distance = 0;
  hitsLabel.textContent = finesLabel.textContent = '0';
  cameras = [];
  shot = null;
  untilCamera = 0.25;
  overlay.hidden = true;
  for (const button of shootButtons) button.disabled = false;
  shootButtons[0].focus();
  previous = performance.now();
  requestAnimationFrame(frame);
});
window.addEventListener('keydown', event => {
  if (!running || !['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
  event.preventDefault();
  if (!event.repeat) fireSide(event.key === 'ArrowLeft' ? -1 : 1);
});
for (const button of shootButtons) {
  button.addEventListener('click', () => fireSide(Number(button.dataset.side)));
}
canvas.addEventListener('click', event => {
  if (!running) return;
  const bounds = canvas.getBoundingClientRect();
  const x = (event.clientX - bounds.left) * canvas.width / bounds.width;
  const y = (event.clientY - bounds.top) * canvas.height / bounds.height;
  const target = cameras.find(camera =>
    Math.abs(cameraX(camera) - x) <= 20 && Math.abs(camera.y - y) <= 20
  );
  fire(x, y, target);
});

async function updateRanking(result) {
  const request = ++rankingRequest;
  const level = difficulty.value;
  records.replaceChildren();
  recordStatus.textContent = result ? 'Сохраняем результат…' : 'Загружаем рекорды…';
  try {
    const response = await fetch(rankingUrl + '/' + level, result ? {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Password': localStorage.getItem('appPassword') ?? '' },
      body: JSON.stringify(result),
    } : undefined);
    if (!response.ok) throw new Error('Не удалось обновить таблицу');
    const rows = await response.json();
    if (request !== rankingRequest) return false;
    rows.forEach((row, index) => {
      const tr = records.insertRow();
      for (const value of [index + 1, row.name, row.score]) tr.insertCell().textContent = value;
    });
    recordStatus.textContent = rows.length ? '' : 'На этой сложности пока нет рекордов.';
    return true;
  } catch {
    if (request === rankingRequest) {
      recordStatus.textContent = result ? 'Не удалось сохранить результат. Попробуй ещё раз.' : 'Не удалось загрузить рекорды.';
    }
    return false;
  }
}

difficulty.addEventListener('change', () => {
  publish.hidden = true;
  void updateRanking();
});
publish.addEventListener('submit', async event => {
  event.preventDefault();
  const name = player.value.trim();
  if (!name || running || publish.hidden) return;
  const submit = publish.querySelector('button');
  submit.disabled = start.disabled = difficulty.disabled = true;
  if (await updateRanking({ name, score: hits })) publish.hidden = true;
  submit.disabled = start.disabled = difficulty.disabled = false;
});
void updateRanking();
draw();
</script>
</html>
